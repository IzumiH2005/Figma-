<title>Maquette Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root {
  --ui-bg: #F5F5F7; --ui-panel: #FFFFFF; --ui-panel-2: #F3F3F6; --ui-line: #E6E6EC; --ui-line-2: #D9D9E1;
  --ui-text: #18181D; --ui-muted: #74747F; --ui-faint: #A3A3AE; --ui-hover: #F0F0F4; --ui-input: #F3F3F6;
  --ui-accent: #6E56F8; --ui-accent-soft: rgba(110,86,248,.12); --ui-accent-text: #fff;
  --ui-sel: #3D8BFF; --ui-proto: #3D8BFF; --ui-danger: #E5484D; --ui-ok: #23A26D; --ui-warn: #D9900B;
  --cv-bg: #E9E9EE; --cv-dot: rgba(0,0,0,.07);
  --code-bg: #FBFBFD; --hl-t: #C2185B; --hl-comp: #6E56F8; --hl-a: #2563EB; --hl-ev: #D9480F; --hl-st: #0E9F6E; --hl-s: #16794A; --hl-e: #A15C00; --hl-tok: #8B3FD6; --hl-n: #0B7285; --hl-c: #9A9AA6;
  --shadow: 0 8px 30px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #111114; --ui-panel: #19191E; --ui-panel-2: #1F1F25; --ui-line: #2A2A31; --ui-line-2: #34343C;
    --ui-text: #ECECF1; --ui-muted: #9A9AA6; --ui-faint: #6A6A75; --ui-hover: #24242B; --ui-input: #24242B;
    --ui-accent: #8B7BFF; --ui-accent-soft: rgba(139,123,255,.16);
    --cv-bg: #0E0E11; --cv-dot: rgba(255,255,255,.06);
    --code-bg: #141418; --hl-t: #FF7AB6; --hl-comp: #B4A6FF; --hl-a: #7CB3FF; --hl-ev: #FFA45C; --hl-st: #5EE0A8; --hl-s: #9BE38A; --hl-e: #FFD479; --hl-tok: #D8A6FF; --hl-n: #6FD6E8; --hl-c: #6A6A78;
    --shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-bg: #111114; --ui-panel: #19191E; --ui-panel-2: #1F1F25; --ui-line: #2A2A31; --ui-line-2: #34343C;
  --ui-text: #ECECF1; --ui-muted: #9A9AA6; --ui-faint: #6A6A75; --ui-hover: #24242B; --ui-input: #24242B;
  --ui-accent: #8B7BFF; --ui-accent-soft: rgba(139,123,255,.16);
  --cv-bg: #0E0E11; --cv-dot: rgba(255,255,255,.06);
  --code-bg: #141418; --hl-t: #FF7AB6; --hl-comp: #B4A6FF; --hl-a: #7CB3FF; --hl-ev: #FFA45C; --hl-st: #5EE0A8; --hl-s: #9BE38A; --hl-e: #FFD479; --hl-tok: #D8A6FF; --hl-n: #6FD6E8; --hl-c: #6A6A78;
  --shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ui-bg); color: var(--ui-text); font: 12px/1.4 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
.ic { display: inline-grid; place-items: center; flex-shrink: 0; }
.muted { color: var(--ui-muted); }
.grow { flex: 1; }
kbd { font: 500 10.5px/1 "JetBrains Mono", monospace; background: var(--ui-input); border: 1px solid var(--ui-line); border-bottom-width: 2px; padding: 3px 5px; border-radius: 5px; white-space: nowrap; }

/* ---------- layout */
.topbar { height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--ui-panel); border-bottom: 1px solid var(--ui-line); position: relative; z-index: 20; }
.main { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 248px 1fr 280px; }
.panel { background: var(--ui-panel); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; min-width: 0; }
.left { border-right: 1px solid var(--ui-line); }
.right { border-left: 1px solid var(--ui-line); display: flex; flex-direction: column; overflow: hidden; }
.center { position: relative; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }

.brand { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 2px; font-size: 13px; letter-spacing: -.2px; }
.brand .logo { display: grid; }
.filebtn { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; color: var(--ui-muted); max-width: 220px; }
.filebtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filebtn em { color: var(--ui-accent); font-style: normal; font-size: 18px; line-height: 0; }
.filebtn:hover, .tb:hover, .zoom:hover { background: var(--ui-hover); color: var(--ui-text); }
.tools { display: flex; gap: 2px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--ui-line); }
.tb { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--ui-muted); }
.tb.on { background: var(--ui-accent); color: var(--ui-accent-text); }
.pagename { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.zoom { height: 30px; padding: 0 8px; border-radius: 8px; color: var(--ui-muted); font-variant-numeric: tabular-nums; min-width: 52px; }
.playbtn { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; background: var(--ui-accent); color: #fff; font-weight: 600; }
.playbtn:hover { filter: brightness(1.08); }
.modes { display: flex; gap: 4px; }

/* ---------- panels */
.ptabs { display: flex; gap: 0; padding: 8px 6px 0; border-bottom: 1px solid var(--ui-line); position: sticky; top: 0; background: var(--ui-panel); z-index: 2; flex-shrink: 0; }
.ptab { padding: 6px 6px 8px; font-weight: 600; color: var(--ui-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 5px; }
.ptab.on { color: var(--ui-text); border-color: var(--ui-text); }
.ptab .badge { background: var(--ui-danger); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 5px; line-height: 15px; }
.pbody { overflow-y: auto; flex: 1; scrollbar-width: thin; padding-bottom: 40px; }
.phead { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 6px; font-weight: 600; font-size: 11.5px; color: var(--ui-muted); }
.mini { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; color: var(--ui-muted); flex-shrink: 0; }
.mini:hover { background: var(--ui-hover); color: var(--ui-text); }

.pages { border-bottom: 1px solid var(--ui-line); padding-bottom: 6px; }
.page { display: flex; align-items: center; gap: 8px; padding: 5px 14px; cursor: pointer; color: var(--ui-muted); }
.page.on { color: var(--ui-text); font-weight: 600; }
.page:hover { background: var(--ui-hover); }

.ltree { padding: 0 0 30px; }
.lrow { display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 6px; cursor: default; color: var(--ui-text); position: relative; white-space: nowrap; }
.lrow:hover { background: var(--ui-hover); }
.lrow.sel { background: var(--ui-accent-soft); }
.lrow.comp { color: var(--ui-accent); }
.lrow.hid { opacity: .45; }
.lrow .twist { width: 12px; display: grid; place-items: center; color: var(--ui-faint); }
.lrow .ic { color: var(--ui-muted); }
.lrow.comp .ic { color: var(--ui-accent); }
.lname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.lact { opacity: 0; } .lrow:hover .lact, .lrow.hid .lact { opacity: 1; }
.lrow[data-drop="before"]::before, .lrow[data-drop="after"]::after { content: ""; position: absolute; left: 8px; right: 8px; height: 2px; background: var(--ui-sel); }
.lrow[data-drop="before"]::before { top: 0; } .lrow[data-drop="after"]::after { bottom: 0; }
.lrow[data-drop="inside"] { outline: 2px solid var(--ui-sel); outline-offset: -2px; }

.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px 8px; }
.acard { border: 1px solid var(--ui-line); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--ui-panel-2); }
.acard:hover { border-color: var(--ui-accent); }
.aprev { position: relative; height: 84px; overflow: hidden; background: #fff; }
.aname { padding: 5px 8px; font-weight: 500; font-size: 11px; border-top: 1px solid var(--ui-line); }
.search { width: calc(100% - 20px); margin: 0 10px 8px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: var(--ui-input); padding: 0 10px; outline: 0; }
.search:focus { border-color: var(--ui-accent); }
.igrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 0 10px 10px; }
.ibtn { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; color: var(--ui-text); }
.ibtn:hover { background: var(--ui-hover); color: var(--ui-accent); }
.imgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px 10px; }
.imbtn { aspect-ratio: 1; border-radius: 8px; background-size: cover; background-position: center; outline: 1px solid var(--ui-line); }
.imbtn:hover { outline: 2px solid var(--ui-accent); }
.dlist { padding: 0 8px 24px; }
.dbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 7px; text-align: left; }
.dbtn:hover { background: var(--ui-hover); }
.dbtn span { flex: 1; } .dbtn em { color: var(--ui-faint); font-style: normal; font-variant-numeric: tabular-nums; }

.tlist { padding: 0 8px 10px; }
.trow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; cursor: pointer; }
.trow:hover { background: var(--ui-hover); }
.trow.kit { opacity: .55; }
.tname { font: 500 11.5px "JetBrains Mono", monospace; color: var(--hl-tok); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tvals { display: flex; gap: 4px; }
.sw { width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.3); }
.tv { font: 11px "JetBrains Mono", monospace; color: var(--ui-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--ui-faint); padding: 6px; }

/* ---------- inspector widgets */
.selhead { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--ui-line); }
.tagpill { font: 600 11px "JetBrains Mono", monospace; padding: 4px 7px; border-radius: 6px; background: var(--ui-input); color: var(--hl-t); white-space: nowrap; }
.tagpill.comp { color: var(--ui-accent); background: var(--ui-accent-soft); }
.sec { border-bottom: 1px solid var(--ui-line); padding: 10px 12px 12px; }
.sectitle { font-weight: 600; margin-bottom: 8px; font-size: 11.5px; }
.secbody { display: flex; flex-direction: column; gap: 7px; }
.prow { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.prow > label { flex: 1; color: var(--ui-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow > .sel, .prow > .inp, .prow > .colorf, .prow > .iconpick { flex: 1.6; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.inp, .sel, .numinp { height: 28px; border-radius: 7px; border: 1px solid transparent; background: var(--ui-input); padding: 0 8px; outline: 0; width: 100%; min-width: 0; }
.inp:focus, .numinp:focus, .sel:focus { border-color: var(--ui-accent); }
.inp.mono, .numinp { font-family: "JetBrains Mono", monospace; font-size: 11px; }
.sel { padding-right: 4px; cursor: pointer; }
.selhead .inp { flex: 1; }
label.num { display: flex; align-items: center; height: 28px; border-radius: 7px; background: var(--ui-input); padding-left: 8px; gap: 4px; min-width: 0; border: 1px solid transparent; }
label.num:focus-within { border-color: var(--ui-accent); }
label.num .nlabel { color: var(--ui-faint); cursor: ew-resize; user-select: none; font-size: 11px; white-space: nowrap; }
label.num .numinp { background: none; border: 0; padding: 0 6px 0 2px; height: 26px; }
label.num .numinp.dim { color: var(--ui-faint); }
label.num .unit { color: var(--ui-faint); padding-right: 8px; }
.sizef { display: flex; flex-direction: column; gap: 4px; }
.sizef .sizemode { height: 22px; font-size: 10.5px; color: var(--ui-muted); background: transparent; padding-left: 4px; }
.tgl { width: 32px; height: 18px; border-radius: 99px; background: var(--ui-line-2); position: relative; flex-shrink: 0; transition: background .15s; }
.tgl i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.tgl.on { background: var(--ui-accent); } .tgl.on i { left: 16px; }
.seg { display: flex; background: var(--ui-input); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--ui-muted); }
.seg button.on { background: var(--ui-panel); color: var(--ui-text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.alignrow { display: flex; gap: 10px; align-items: center; }
.amatrix { display: grid; grid-template-columns: repeat(3, 22px); gap: 2px; background: var(--ui-input); padding: 4px; border-radius: 8px; }
.amatrix button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; }
.amatrix button i { width: 4px; height: 4px; border-radius: 2px; background: var(--ui-faint); }
.amatrix button:hover i { background: var(--ui-text); }
.amatrix button.on i { width: 12px; height: 4px; background: var(--ui-accent); }
.alignside { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { height: 24px; padding: 0 8px; border-radius: 99px; background: var(--ui-input); color: var(--ui-muted); font-size: 11px; white-space: nowrap; }
.chip:hover { color: var(--ui-text); }
.chip.on { background: var(--ui-accent); color: #fff; }
.colorf { display: flex; align-items: center; gap: 6px; }
.colorf .inp { flex: 1; }
.swatch { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.hiddenpick { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
.iconpick { display: flex; align-items: center; gap: 6px; }
.hint { color: var(--ui-faint); font-size: 11px; line-height: 1.45; }
.hint a { color: var(--ui-accent); cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; background: var(--ui-input); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--ui-line); }
.btn.primary { background: var(--ui-accent); color: #fff; }
.btn.ghost { background: transparent; color: var(--ui-accent); padding: 0; }
.pad { padding: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 0; }
.kv span { color: var(--ui-muted); }
.atable { display: flex; flex-direction: column; gap: 3px; }
.arow { display: grid; grid-template-columns: 1fr 1.4fr 22px; gap: 4px; align-items: center; }
.arow input { height: 24px; border-radius: 5px; border: 1px solid transparent; background: var(--ui-input); padding: 0 6px; font: 11px "JetBrains Mono", monospace; outline: 0; min-width: 0; }
.arow input:focus { border-color: var(--ui-accent); }
.arow .ak { color: var(--hl-a); }
.arow.add input { background: transparent; border: 1px dashed var(--ui-line-2); }
.inter { border: 1px solid var(--ui-line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.ihead { display: flex; align-items: center; gap: 6px; color: var(--ui-proto); }
.ihead .sel { flex: 1; color: var(--ui-text); }
.ibody { display: flex; flex-direction: column; gap: 6px; }
.iraw .inp { font-size: 10.5px; color: var(--hl-ev); }
pre.ref { margin: 0; font: 10.5px/1.6 "JetBrains Mono", monospace; color: var(--ui-muted); white-space: pre-wrap; background: var(--ui-input); padding: 10px; border-radius: 8px; }
.easebox { background: var(--ui-input); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.easecurve { width: 100%; height: 64px; } .easecurve path { fill: none; stroke: var(--ui-accent); stroke-width: 2; }
.issue { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--ui-line); cursor: pointer; }
.issue:hover { background: var(--ui-hover); }
.issue.error .ic { color: var(--ui-danger); } .issue.warn .ic { color: var(--ui-warn); } .issue.info .ic { color: var(--ui-sel); }
.imsg { line-height: 1.4; } .imeta { color: var(--ui-faint); font-size: 10.5px; margin-top: 2px; }
.okmsg { display: flex; gap: 8px; align-items: center; padding: 14px 12px; color: var(--ui-ok); }

/* ---------- canvas */
.canvas { position: relative; flex: 1; overflow: hidden; background-color: var(--cv-bg); background-image: radial-gradient(var(--cv-dot) 1px, transparent 1px); background-size: 24px 24px; touch-action: none; }
.canvas[data-tool="hand"], .canvas.grab { cursor: grab; } .canvas.panning { cursor: grabbing; }
.canvas[data-tool="frame"], .canvas[data-tool="rect"], .canvas[data-tool="ellipse"], .canvas[data-tool="image"], .canvas[data-tool="note"] { cursor: crosshair; }
.canvas[data-tool="text"] { cursor: text; }
.cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
.cv-item { position: absolute; }
.cv-item > .mq-screen { box-shadow: 0 2px 10px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.06); }
.cv-item * { cursor: inherit; }
.cv-error { padding: 20px; background: #fff0f0; color: #b00; border-radius: 8px; }
.cv-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cv-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cv-label { position: absolute; pointer-events: auto; font-size: 11.5px; color: var(--ui-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; padding: 2px 0; user-select: none; }
.cv-label:hover { color: var(--ui-text); }
.cv-label.sel { color: var(--ui-sel); font-weight: 500; }
.cv-hover { position: absolute; outline: 1.5px solid var(--ui-sel); }
.cv-sel { position: absolute; outline: 1.5px solid var(--ui-sel); }
.cv-sel.ghost { outline-style: dashed; opacity: .6; }
.cv-handle { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: #fff; border: 1.5px solid var(--ui-sel); border-radius: 2px; pointer-events: auto; }
.cv-handle.n, .cv-handle.s { cursor: ns-resize; } .cv-handle.e, .cv-handle.w { cursor: ew-resize; }
.cv-handle.nw, .cv-handle.se { cursor: nwse-resize; } .cv-handle.ne, .cv-handle.sw { cursor: nesw-resize; }
.cv-size { position: absolute; transform: translateX(-50%); background: var(--ui-sel); color: #fff; font: 600 10.5px/1 Inter; padding: 3px 5px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cv-guide { position: absolute; background: #FF3B6B; } .cv-guide.v { width: 1px; } .cv-guide.hz { height: 1px; }
.cv-insert { position: absolute; background: var(--ui-sel); border-radius: 2px; box-shadow: 0 0 0 1px #fff; }
.cv-droptarget { position: absolute; outline: 2px dashed var(--ui-sel); outline-offset: 2px; }
.cv-marquee { position: absolute; background: rgba(61,139,255,.08); outline: 1px solid var(--ui-sel); }
.cv-draw { position: absolute; outline: 1.5px solid var(--ui-sel); background: rgba(61,139,255,.06); }
.cv-noodle { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--ui-proto); border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); pointer-events: auto; cursor: crosshair; }
.cv-link { fill: none; stroke: var(--ui-proto); stroke-width: 1.5; opacity: .55; }
.cv-link.hot { opacity: 1; stroke-width: 2; }
.cv-link-dot { fill: var(--ui-proto); opacity: .6; } .cv-link-dot.hot { opacity: 1; }
.cv-link-label { fill: var(--ui-proto); font: 600 10.5px Inter; text-anchor: middle; paint-order: stroke; stroke: var(--cv-bg); stroke-width: 4px; }
.cv-measure-box { position: absolute; outline: 1px dashed #FF3B6B; }
.cv-mline { position: absolute; background: #FF3B6B; height: 1px; } .cv-mline.v { width: 1px; height: auto; }
.cv-mlabel { position: absolute; transform: translate(-50%, -50%); background: #FF3B6B; color: #fff; font: 600 10px/1 Inter; padding: 3px 4px; border-radius: 3px; }
.cv-rename { position: absolute; pointer-events: auto; height: 22px; font-size: 11.5px; border: 1px solid var(--ui-sel); border-radius: 4px; padding: 0 4px; background: var(--ui-panel); outline: 0; }
.cv-editing { outline: 2px solid var(--ui-sel) !important; outline-offset: 2px; cursor: text !important; user-select: text; }
body.proto .cv-sel, body.proto .cv-handle { --ui-sel: var(--ui-proto); }

/* ---------- drawers */
.timeline, .codedrawer { display: none; background: var(--ui-panel); border-top: 1px solid var(--ui-line); flex-shrink: 0; }

<script type="text/x-maquette" data-file="systeme-ui.mq"><project name="Atelier — Système UI" typescale=ui fonts="Inter:400;500;600;700|Fraunces:500;600" modes="light dark">
  <!-- Palette générée : une primaire (ramp → 50…950), des gris teintés de la primaire, un accent. Règle 60-30-10. -->
  <tokens>
    brand: ramp(#0F7B6C)
    gray: neutrals(#0F7B6C, 0.012)
    primary: $brand-700
    on-primary: #FFFFFF
    primary-soft: alpha($brand-500, 14)
    tab-active: $brand-700 | $brand-300
    bg: #FFFFFF | $gray-950
    surface: $gray-50 | $gray-900
    surface-2: $gray-100 | $gray-800
    text: $gray-950 | $gray-50
    muted: $gray-600 | $gray-400
    border: $gray-200 | $gray-800
    accent: #F5A524
    serif: "Fraunces"
  </tokens>

  <vars>
    tab: 0
    faq: 0
    step: 2
    steps: ["50","100","200","300","400","500","600","700","800","900","950"]
    type: [{"n":"display","s":"56 / 1.05 · 700"},{"n":"h1","s":"40 / 1.1 · 700"},{"n":"h2","s":"32 / 1.15 · 700"},{"n":"h3","s":"28 / 1.2 · 700"},{"n":"h4","s":"24 / 1.25 · 600"},{"n":"title","s":"20 / 1.3 · 600"},{"n":"body-lg","s":"18 / 1.5 · 400"},{"n":"body","s":"16 / 1.5 · 400"},{"n":"body-sm","s":"14 / 1.45 · 400"},{"n":"label","s":"14 / 1.3 · 600"},{"n":"caption","s":"12 / 1.35 · 500"}]
    space: [4, 8, 12, 16, 24, 32, 48, 64, 80]
    shadows: ["e1","e2","e3","e4","e5","soft","layered","brutal"]
    kinds: ["primary","secondary","tonal","outline","ghost","link","danger"]
    states: ["","hover","pressed","focus","disabled","loading"]
  </vars>

  <styles>
    .page { w=fill maxw=1240 mx=auto px=40 }
    .section { col gap=32 py=64 stroke-t="1 $border" }
    .eyebrow { size=12 weight=600 upper ls=1 color=$primary }
    .stitle { font=$serif size=40 weight=500 ls=-1 lh=1.1 }
    .swatch-label { size=12 weight=500 mono }
  </styles>

  <component name="SectionHead" props="eyebrow='' title='' text=''">
    <col gap=12 maxw=640>
      <text class=eyebrow>{eyebrow}</text>
      <text class=stitle>{title}</text>
      <text if={text} color=$muted size=16 lh=1.6>{text}</text>
    </col>
  </component>

  <component name="RampRow" props="name=brand label='Primaire'">
    <col gap=8 w=fill>
      <row gap=auto><text weight=600 size=14>{label}</text><text size=12 color=$muted mono>${name}-50 … ${name}-950</text></row>
      <row w=fill radius=12 clip>
        <col each={$steps} as=st w=fill h=88 p=8 justify=end gap=0 fill={'$' + name + '-' + st} color={onColor(dollar(name + '-' + st))}>
          <text size=12 weight=600>{st}</text>
          <text size=12 mono>{dollar(name + '-' + st)}</text>
        </col>
      </row>
    </col>
  </component>

  <page name="Système">
    <screen name="Style guide" device=desktop h=auto start fill=$bg>
      <col class=page gap=0>
        <row h=72 gap=auto>
          <row gap=12><stack w=32 h=32 radius=8 fill=$primary center><icon name=pen-tool size=18 color=$on-primary/></stack><text weight=700 size=18>Atelier · Système UI</text></row>
          <row gap=8><Badge label="v2.0" tone=neutral/><IconButton icon=sun-moon kind=tonal size=40 on:click="mode next"/></row>
        </row>
        <col gap=20 pt=48 pb=64 maxw=760 stagger="70 fade-up 500">
          <text class=eyebrow>Style guide</text>
          <text font=$serif size=56 weight=500 ls=-1.5 lh=1.05 balance>Des fondations cohérentes, vérifiées automatiquement.</text>
          <text size=18 color=$muted lh=1.6>Une primaire, des gris teintés, une échelle typographique, une grille de 8 px et des composants dont chaque état est documenté. Chaque écran passe par le lint d'hygiène (contraste, cibles, grille, échelle).</text>
        </col>

        <!-- couleurs -->
        <col class=section>
          <SectionHead eyebrow=Couleurs title="Une primaire, des neutres, un accent" text="Générées avec ramp() et neutrals() : les gris contiennent une pointe de la primaire, jamais de gris pur. Les couleurs système portent du sens (succès, alerte, erreur, info)."/>
          <RampRow name=brand label="Primaire — brand"/>
          <RampRow name=gray label="Neutres teintés — gray"/>
          <row gap=12 w=fill>
            <col each={['primary','accent','success','warning','danger','info']} as=c w=fill gap=8>
              <frame h=64 radius=12 fill={'$' + c}/>
              <text size=14 weight=600>${c}</text>
              <text size=12 color=$muted mono>{dollar(c)}</text>
            </col>
          </row>
        </col>

        <!-- typographie -->
        <col class=section>
          <SectionHead eyebrow=Typographie title="Une échelle, pas des tailles au hasard" text="Classes t-display … t-caption générées depuis typescale=ui. Le lint signale toute taille hors échelle et propose la plus proche."/>
          <col gap=0 w=fill>
            <row each={$type} as=t gap=24 py=12 stroke-b="1 $border" align=baseline>
              <text w=120 size=12 color=$muted mono>t-{t.n}</text>
              <text w=fill class={'t-' + t.n} truncate>Orchestrer chaque détail</text>
              <text w=140 size=12 color=$muted mono align=right>{t.s}</text>
            </row>
          </col>
        </col>

        <!-- espacements, rayons, ombres -->
        <col class=section>
          <SectionHead eyebrow="Espacement & élévation" title="Grille de 8 px, une seule source de lumière"/>
          <row gap=48 w=fill align=start wrap>
            <col gap=12>
              <text weight=600 size=14>Espacements</text>
              <row each={$space} as=sp gap=16><text w=32 size=12 color=$muted mono>{sp}</text><frame w={sp * 3} h=16 radius=4 fill=$primary-soft stroke="1 $primary"/></row>
            </col>
            <col gap=12 w=fill>
              <text weight=600 size=14>Ombres (shadow=…)</text>
              <grid cols=4 gap=24 p=24 radius=16 fill=$surface>
                <col each={$shadows} as=sh h=96 radius={sh == 'brutal' ? 4 : 16} fill=$bg stroke={sh == 'brutal' ? '2 #111' : 'none'} shadow={sh} center><text size=14 weight=600 mono>{sh}</text></col>
              </grid>
            </col>
          </row>
        </col>

        <!-- boutons -->
        <col class=section>
          <SectionHead eyebrow=Boutons title="Hiérarchie et états" text="Un seul primaire par vue ; secondary/outline pour l'action moyenne, link pour la tertiaire. États distincts mais sobres. Hauteurs 40 / 48 / 56."/>
          <col gap=0 w=fill radius=16 stroke="1 $border" clip>
            <row h=48 px=20 gap=16 fill=$surface>
              <text w=96 size=12 color=$muted weight=600 upper ls=1>kind</text>
              <text each={['défaut','hover','pressé','focus','désactivé','chargement']} as=st w=fill size=12 color=$muted weight=600 upper ls=1>{st}</text>
            </row>
            <row each={$kinds} as=k h=80 px=20 gap=16 stroke-t="1 $border">
              <text w=96 size=14 mono>{k}</text>
              <stack each={$states} as=st w=fill><Button label={k == 'danger' ? 'Supprimer' : 'Continuer'} kind={k} size=sm state={st}/></stack>
            </row>
          </col>
          <row gap=12><Button label="Créer un projet" icon=plus/><Button label="Importer" kind=outline icon=upload/><Button label="Voir la documentation" kind=link iconRight=arrow-up-right/></row>
        </col>

        <!-- formulaires -->
        <col class=section>
          <SectionHead eyebrow=Formulaires title="Labels visibles, erreurs explicites" text="Label toujours affiché, « (optionnel) » plutôt qu'un astérisque, placeholder qui montre le format, erreur avec icône et solution."/>
          <grid cols=3 gap=24 w=fill align=start>
            <Field label="Nom complet" placeholder="Ada Lovelace"/>
            <Field label="E-mail" placeholder="ada@exemple.fr" icon=mail error="Format attendu : nom@domaine.fr"/>
            <Field label="Téléphone" placeholder="06 12 34 56 78" icon=phone optional hint="Uniquement pour la livraison"/>
            <Field label="Code promo" placeholder="PRINTEMPS24" valid/>
            <Select label="Pays" value="France"/>
            <col gap=16><Checkbox checked label="Recevoir la newsletter"/><Checkbox label="Accepter les CGU"/><Radio checked label="Livraison standard"/></col>
          </grid>
        </col>

        <!-- feedback -->
        <col class=section>
          <SectionHead eyebrow=Feedback title="Statuts système" text="Succès vert, alerte orange, erreur rouge, info bleu : toujours accompagnés d'une icône et d'un texte foncé (contraste ≥ 4.5:1)."/>
          <grid cols=2 gap=16 w=fill>
            <Alert tone=success title="Paiement confirmé" text="Votre reçu a été envoyé par e-mail."/>
            <Alert tone=warning title="Abonnement bientôt expiré" text="Renouvelez avant le 30 novembre."/>
            <Alert tone=error title="Échec de l'envoi" text="Vérifiez votre connexion puis réessayez."/>
            <Alert tone=info title="Nouveauté" text="Les exports PDF sont disponibles."/>
          </grid>
          <row gap=24 align=center wrap>
            <Snackbar/>
            <Toast message="Modifications enregistrées"/>
            <Tooltip text="Augmente les frais pour accélérer la transaction."/>
          </row>
        </col>

        <!-- navigation -->
        <col class=section>
          <SectionHead eyebrow=Navigation title="Où suis-je, où aller ?"/>
          <grid cols=2 gap=40 w=fill align=start>
            <col gap=24>
              <Tabs items={['Aperçu','Activité','Membres','Réglages']} active={$tab} var=tab/>
              <Breadcrumbs items={['Projets','Atelier','Système UI']}/>
              <Stepper step={$step} total=4/>
              <row gap=12><Button label="Étape précédente" kind=secondary size=sm on:click="if $step > 1 then dec $step"/><Button label="Étape suivante" size=sm on:click="if $step < 4 then inc $step"/></row>
              <Pagination count=5 active=2/>
              <Segmented items={['Jour','Semaine','Mois']} active=1/>
            </col>
            <row gap=24 align=start>
              <Menu>
                <MenuItem label="Annuler" icon=undo-2 shortcut="⌘Z"/>
                <MenuItem label="Rétablir" icon=redo-2 shortcut="⇧⌘Z"/>
                <divider/>
                <MenuItem label="Copier comme" icon=copy submenu/>
                <MenuItem label="Dupliquer" icon=copy-plus shortcut="⌘D" selected/>
                <MenuItem label="Exporter (bientôt)" icon=download disabled/>
                <divider/>
                <MenuItem label="Supprimer" icon=trash-2 shortcut="⌫" danger/>
              </Menu>
              <col gap=16 w=240>
                <Select label="Trier par" value="Plus récents" open>
                  <Menu w=fill>
                    <MenuItem label="Plus récents" selected/>
                    <MenuItem label="Recommandés"/>
                    <MenuItem label="Prix croissant"/>
                    <MenuItem label="Prix décroissant"/>
                  </Menu>
                </Select>
              </col>
            </row>
          </grid>
        </col>

        <!-- affichage de données -->
        <col class=section>
          <SectionHead eyebrow="Contenu & confiance" title="Cartes, preuve sociale, états vides"/>
          <grid cols=3 gap=24 w=fill align=stretch>
            <Testimonial quote="On a divisé par deux le temps passé en allers-retours avec les développeurs." name="Inès Kaci" role="Lead design, Hélios"/>
            <Testimonial quote="Les états des composants sont enfin documentés au même endroit." name="Malik Diallo" role="Développeur front"/>
            <col gap=16 p=24 radius=20 fill=$surface stroke="1 $border">
              <Stat label="Taux de conversion" value="4,8 %" delta="+0,6 pt ce mois"/>
              <SocialProof/>
              <row gap=8 wrap><Chip label=Figma selected/><Chip label=Tokens/><Chip label=A11y icon=accessibility/><Badge label=Nouveau/></row>
            </col>
          </grid>
          <row gap=24 align=start>
            <col w=fill radius=20 stroke="1.5 $border dashed"><EmptyState icon=folder-open title="Aucun projet pour l'instant" text="Crée ton premier projet ou importe un fichier .mq existant." action="Créer un projet"/></col>
            <ConfirmDialog/>
          </row>
        </col>
        <row h=80 gap=auto stroke-t="1 $border" size=14 color=$muted><text>Atelier · Système UI v2.0</text><text>Généré et vérifié avec Maquette</text></row>
      </col>
      <FAB fixed place=bottom-right m=32 icon=plus label="Composant"/>
    </screen>

    <screen name="Formulaire mobile" device=iphone-se statusbar fill=$bg pt=safe px=20 pb=24 gap=24 x=1540>
      <row h=48 gap=auto><IconButton icon=chevron-left on:click="back"/><text weight=600 size=16>Livraison</text><spacer size=44/></row>
      <Stepper step=2 total=3 label="Étape 2 sur 3 · Adresse"/>
      <col gap=16>
        <Field label="Adresse" placeholder="12 rue des Lilas" icon=map-pin/>
        <row gap=12><Field label="Code postal" placeholder="75011" w=136/><Field label="Ville" placeholder="Paris"/></row>
        <Field label="Complément" placeholder="Bâtiment, étage…" optional/>
      </col>
      <spacer/>
      <col gap=12>
        <Button label="Continuer vers le paiement" full size=lg iconRight=arrow-right/>
        <text size=12 color=$muted align=center>Vous pourrez modifier ces informations avant de payer.</text>
      </col>
    </screen>

    <note x=1540 y=720 w=375>Règles appliquées sur ce formulaire : labels visibles, « (optionnel) » au lieu d'astérisques, champ CP à la largeur attendue, progression d'étapes, CTA pleine largeur dans la zone du pouce, verbe + destination.</note>
  </page>
</project>

<component name="Button" props="label='Bouton' kind=primary size=md icon='' iconRight='' full=false loading=false disabled=false state=''" desc="Bouton. kind: primary|secondary|tonal|outline|ghost|link|danger ; size: sm|md|lg (40/48/56px) ; state: hover|pressed|focus|disabled|loading (pour documenter les \xE9tats)">
  <ButtonBase label={label} kind={kind} size={size} icon={icon} iconRight={iconRight} full={full} loading={loading || state == 'loading'} disabled={disabled || state == 'disabled'} state={state}
    bg={kind == 'primary' ? $primary : kind == 'danger' ? $danger : kind == 'secondary' ? $surface : kind == 'tonal' ? $primary-soft : 'transparent'}
    fg={kind == 'primary' ? $on-primary : kind == 'danger' ? '#FFFFFF' : kind == 'secondary' ? $text : $primary}/>
</component>

<component name="ButtonBase" props="label='' kind=primary size=md icon='' iconRight='' full=false loading=false disabled=false state='' bg='transparent' fg='#000000'" desc="(interne) rendu commun des boutons">
  <row gap=8 justify=center radius={size == 'lg' ? 16 : 12} h={kind == 'link' ? 'hug' : size == 'sm' ? 40 : size == 'lg' ? 56 : 48} minh={kind == 'link' ? 44 : 0} px={kind == 'link' ? 4 : size == 'sm' ? 16 : 24} w={full ? 'fill' : 'hug'}
    fill={state == 'hover' ? (bg == 'transparent' ? alpha(fg, 8) : shade(bg, 10)) : state == 'pressed' ? (bg == 'transparent' ? alpha(fg, 14) : shade(bg, 18)) : bg}
    hover:fill={bg == 'transparent' ? alpha(fg, 8) : shade(bg, 10)} press:fill={bg == 'transparent' ? alpha(fg, 14) : shade(bg, 18)} press:scale=0.98
    color={fg} stroke={kind == 'outline' ? '1.5 ' + alpha(fg, 45) : 'none'} underline={kind == 'link'}
    shadow={state == 'focus' ? '0 0 0 3px ' + alpha($primary, 40) : 'none'} focus:shadow={'0 0 0 3px ' + alpha($primary, 40)}
    opacity={disabled ? 0.45 : 1} events={disabled ? 'none' : 'auto'}
    size={size == 'sm' ? 14 : size == 'lg' ? 18 : 16} weight=600>
    <icon if={loading} name=loader-circle size=18 loop="spin 900"/>
    <icon if={icon && !loading} name={icon} size=18/>
    <text if={label} nowrap>{loading ? 'Chargement\u2026' : label}</text>
    <icon if={iconRight && !loading} name={iconRight} size=18/>
  </row>
</component>

<component name="IconButton" props="icon=plus kind=ghost size=44 badge=0" desc="Bouton ic\xF4ne. kind: ghost|filled|tonal|outline">
  <stack w={size} h={size} radius=full center press:scale=0.92
    fill={kind == 'filled' ? $primary : kind == 'tonal' ? $primary-soft : kind == 'glass' ? 'rgba(255,255,255,.16)' : 'transparent'}
    color={kind == 'filled' ? $on-primary : kind == 'tonal' ? $primary : 'inherit'}
    stroke={kind == 'outline' ? '1 ' + $border : 'none'} bgblur={kind == 'glass' ? 16 : 0}>
    <icon name={icon} size={round(size * 0.48)}/>
    <stack if={badge > 0} absolute top=2 right=2 minw=18 h=18 px=5 radius=full fill=$danger center stroke={'2 ' + $bg + ' outside'}>
      <text size=12 weight=700 color=#fff lh=1>{badge}</text>
    </stack>
  </stack>
</component>

<component name="Chip" props="label='Filtre' selected=false icon=''" desc="Puce de filtre / tag s\xE9lectionnable">
  <row gap=8 h=36 px=16 radius=full size=14 weight=500 press:scale=0.96
    fill={selected ? $text : $surface-2} color={selected ? $bg : $text}>
    <icon if={icon} name={icon} size=16/>
    <text nowrap>{label}</text>
  </row>
</component>

<component name="Badge" props="label='Nouveau' tone=primary" desc="\xC9tiquette. tone: primary|success|danger|warning|neutral">
  <row h=22 px=8 radius=full size=12 weight=600
    fill={tone == 'success' ? 'rgba(46,182,125,.14)' : tone == 'danger' ? 'rgba(229,72,77,.14)' : tone == 'warning' ? 'rgba(245,165,36,.16)' : tone == 'neutral' ? $surface : $primary-soft}
    color={tone == 'success' ? mix($success, $text, 45) : tone == 'danger' ? mix($danger, $text, 35) : tone == 'warning' ? mix($warning, $text, 55) : tone == 'neutral' ? $muted : mix($primary, $text, 20)}>
    <text nowrap>{label}</text>
  </row>
</component>

<component name="Avatar" props="name='Ada Lovelace' size=40 src='' ring=false online=false" desc="Avatar illustr\xE9 g\xE9n\xE9r\xE9 depuis le nom (ou src)">
  <stack w={size} h={size}>
    <image src={src || 'avatar:' + name} w={size} h={size} radius=full stroke={ring ? '2 ' + $bg + ' outside' : 'none'}/>
    <ellipse if={online} absolute right=0 bottom=0 size={round(size * 0.28)} fill=$success stroke={'2 ' + $bg + ' outside'}/>
  </stack>
</component>

<component name="Toggle" props="value=false" desc="Interrupteur. Ex: &lt;Toggle value={$wifi} on:click=&quot;toggle $wifi&quot;/&gt;">
  <stack w=52 h=32 radius=full p=3 fill={value ? $success : $surface-2} justify={value ? 'end' : 'start'} align=center transition=220>
    <ellipse name=knob size=26 fill=#fff shadow="0 2 6 rgba(0,0,0,.18)"/>
  </stack>
</component>

<component name="Checkbox" props="checked=false label=''" desc="Case \xE0 cocher">
  <row gap=12>
    <stack w=24 h=24 radius=7 center fill={checked ? $primary : 'transparent'} stroke={checked ? 'none' : '2 ' + $border} color=$on-primary transition=160>
      <icon if={checked} name=check size=16 stroke=3/>
    </stack>
    <text if={label}>{label}</text>
  </row>
</component>

<component name="Radio" props="checked=false label=''" desc="Bouton radio">
  <row gap=12>
    <stack w=24 h=24 radius=full center stroke={checked ? '2 ' + $primary : '2 ' + $border}>
      <ellipse if={checked} size=12 fill=$primary/>
    </stack>
    <text if={label}>{label}</text>
  </row>
</component>

<component name="Field" props="label='' placeholder='Saisir\u2026' bind='' icon='' type=text hint='' error='' optional=false valid=false" desc="Champ texte r\xE9ellement saisissable en prototype (bind=nomDeVariable)">
  <col gap=8 w=fill>
    <text if={label} size=14 weight=600 color=$muted>{label}{optional ? ' (optionnel)' : ''}</text>
    <row gap=12 h=52 px=16 radius=$radius fill=$surface stroke={error ? '1.5 ' + $danger : 'none'} focus:stroke={'2 ' + $primary}>
      <icon if={icon} name={icon} size=18 color=$muted/>
      <input w=fill h=fill placeholder={placeholder} bind={bind} type={type} size=16/>
      <icon if={valid} name=circle-check size=18 color=$success/>
    </row>
    <row if={error} gap=4 size=12 color=$danger><icon name=circle-alert size=14/><text>{error}</text></row>
    <text if={hint && !error} size=12 color=$muted>{hint}</text>
  </col>
</component>

<component name="SearchBar" props="placeholder='Rechercher' bind=''" desc="Barre de recherche">
  <row gap=10 h=44 px=14 radius=12 fill=$surface w=fill color=$muted>
    <icon name=search size=18/>
    <input w=fill placeholder={placeholder} bind={bind} size=16 color=$text/>
  </row>
</component>

<component name="ListItem" props="title='Titre' subtitle='' icon='' avatar='' image='' trailing='' chevron=true tone=''" desc="Ligne de liste (ic\xF4ne/avatar/image + titre + sous-titre + valeur)">
  <row gap=12 py=12 w=fill press:opacity=0.6>
    <stack if={icon} w=40 h=40 radius=12 center fill={tone || $primary-soft} color={tone ? '#fff' : $primary}><icon name={icon} size=20/></stack>
    <Avatar if={avatar} name={avatar} size=44/>
    <image if={image} src={image} w=48 h=48 radius=12/>
    <col gap=2 w=fill>
      <text weight=600 truncate>{title}</text>
      <text if={subtitle} size=14 color=$muted truncate>{subtitle}</text>
    </col>
    <text if={trailing} weight=600 tabular nowrap>{trailing}</text>
    <icon if={chevron} name=chevron-right size=18 color=$muted/>
  </row>
</component>

<component name="Card" props="pad=16" desc="Carte conteneur (slot)">
  <col gap=12 p={pad} radius={$radius + 6} fill=$surface w=fill>
    <slot/>
  </col>
</component>

<component name="NavBar" props="title='' back=true action='' large=false" desc="Barre de navigation (back \u2192 action back)">
  <col w=fill pt=safe>
    <row h=48 px=8 gap=4>
      <IconButton if={back} icon=chevron-left on:click="back"/>
      <spacer if={!back} size=8/>
      <text if={!large} w=fill align=center weight=600 size=18 truncate>{title}</text>
      <spacer if={large}/>
      <IconButton if={action} icon={action}/>
      <spacer if={!action} size={back ? 44 : 8}/>
    </row>
    <text if={large} px=20 pb=8 size=32 weight=800 ls=-0.5>{title}</text>
  </col>
</component>

<component name="TabBar" props="items={[]} active=0" desc="Barre d'onglets. items={[{icon:'house',label:'Accueil',to:'Home'}]}">
  <row w=fill justify=evenly pt=10 pb=safe+4 fill=$bg/92 bgblur=20 stroke-t={'1 ' + $border}>
    <col each={items} gap=4 align=center w=fill press:scale=0.92 color={i == active ? ($tab-active || $primary) : $muted} on:click="go {item.to} instant">
      <icon name={item.icon} size=24 stroke={i == active ? 2.4 : 2}/>
      <text size=12 weight={i == active ? 600 : 500}>{item.label}</text>
    </col>
  </row>
</component>

<component name="Segmented" props="items={['Jour','Semaine','Mois']} active=0 var=''" desc="Contr\xF4le segment\xE9. var=nom de variable \xE0 mettre \xE0 jour">
  <row w=fill p=3 radius=12 fill=$surface gap=2>
    <stack each={items} w=fill h=34 radius=9 center size=14 weight={i == active ? 600 : 500} fill={i == active ? $bg : 'transparent'} shadow={i == active ? 'sm' : 'none'} color={i == active ? $text : $muted} on:click="set \${var} = {i}">
      <text>{item}</text>
    </stack>
  </row>
</component>

<component name="Progress" props="value=0.6 h=8 tone=''" desc="Barre de progression (value 0..1)">
  <stack w=fill h={h} radius=full fill=$surface-2 clip>
    <frame name=progress-fill w={round(value * 1000) / 10 + '%'} h=fill radius=full fill={tone || $primary}/>
  </stack>
</component>

<component name="Slider" props="value=0.5" desc="Curseur (visuel)">
  <stack w=fill h=28 align=center>
    <frame w=fill h=6 radius=full fill=$surface-2/>
    <frame w={value * 100 + '%'} h=6 radius=full fill=$primary/>
    <ellipse absolute x={'calc(' + value * 100 + '% - 13px)'} y=1 size=26 fill=#fff shadow=md/>
  </stack>
</component>

<component name="Skeleton" props="w=120 h=14 r=6" desc="Placeholder de chargement anim\xE9">
  <frame w={w} h={h} radius={r} fill="linear(90, rgba(127,127,127,.12) 0, rgba(127,127,127,.24) 50, rgba(127,127,127,.12) 100)" css="background-size:200% 100%" loop="shimmer 1400"/>
</component>

<component name="Toast" props="message='Enregistr\xE9' icon=check-circle-2" desc="Notification flottante">
  <row gap=10 px=16 h=48 radius=full fill=#111114 color=#fff shadow=lg size=14 weight=500>
    <icon name={icon} size=18 color=$success/>
    <text nowrap>{message}</text>
  </row>
</component>

<component name="Stat" props="label='Revenus' value='12 480 \u20AC' delta='' up=true" desc="Indicateur chiffr\xE9">
  <col gap=4>
    <text size=14 color=$muted>{label}</text>
    <text size=24 weight=700 tabular ls=-0.5>{value}</text>
    <row if={delta} gap=4 size=14 weight=600 color={up ? mix($success, $text, 45) : mix($danger, $text, 30)}>
      <icon name={up ? 'trending-up' : 'trending-down'} size=14/>
      <text>{delta}</text>
    </row>
  </col>
</component>

<component name="Dots" props="count=3 active=0" desc="Indicateur de pagination">
  <row gap=6>
    <frame repeat={count} name={'dot' + i} h=8 w={i == active ? 24 : 8} radius=full fill={i == active ? $primary : $surface-2}/>
  </row>
</component>

<component name="Rating" props="value=4 max=5 size=16" desc="Note en \xE9toiles">
  <row gap=2>
    <icon repeat={max} name=star size={size} color={i < value ? '#FFB020' : $surface-2} fill={i < value ? '#FFB020' : 'none'}/>
  </row>
</component>

<component name="Grabber" props="" desc="Poign\xE9e de bottom sheet">
  <frame w=40 h=5 radius=full fill=$border self=center/>
</component>

<component name="Sheet" props="title=''" desc="Contenu de bottom sheet (\xE0 ouvrir avec overlay \u2026 bottom)">
  <col w=fill fill=$bg radius="28 28 0 0" pt=10 pb=safe+16 px=20 gap=16>
    <Grabber/>
    <text if={title} size=20 weight=700>{title}</text>
    <slot/>
  </col>
</component>

<component name="Dialog" props="title='Confirmer' message='' confirm='OK' cancel='Annuler'" desc="Bo\xEEte de dialogue centr\xE9e (overlay)">
  <col w=300 fill=$bg radius=24 p=24 gap=12 shadow=xl>
    <text size=20 weight=700 align=center>{title}</text>
    <text if={message} color=$muted align=center>{message}</text>
    <slot/>
    <row gap=10 pt=8>
      <Button label={cancel} kind=secondary full on:click="close"/>
      <Button label={confirm} full on:click="close"/>
    </row>
  </col>
</component>

<!-- \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 composants \xAB hygi\xE8ne UI \xBB : chiffres et \xE9tats issus des guidelines \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->

<component name="Tabs" props="items={['Aper\xE7u','Activit\xE9','R\xE9glages']} active=0 var=''" desc="Onglets soulign\xE9s (indicateur anim\xE9 en smart). var=nom de variable \xE0 mettre \xE0 jour">
  <row w=fill gap=24 stroke-b={'1 ' + $border}>
    <stack each={items} h=44 align=center press:opacity=0.7 cursor=pointer on:click="set \${var} = {i}">
      <text weight={i == active ? 600 : 500} color={i == active ? $text : $muted} size=16>{item}</text>
      <frame if={i == active} name=tab-indicator absolute left=0 right=0 bottom=-1 h=2 radius=full fill=$primary/>
    </stack>
  </row>
</component>

<component name="Accordion" props="title='Question' text='' open=false" desc="\xC9l\xE9ment d'accord\xE9on (FAQ). Ex : open={$faq == 1} on:click=&quot;set $faq = $faq == 1 ? -1 : 1&quot;">
  <col w=fill gap=12 py=16 stroke-b={'1 ' + $border} cursor=pointer>
    <row gap=16><text w=fill weight=600 size=16>{title}</text><icon name=chevron-down size=20 color=$muted rotate={open ? 180 : 0} transition=250/></row>
    <text if={open && text} color=$muted lh=1.6>{text}</text>
    <slot if={open}/>
  </col>
</component>

<component name="Stepper" props="step=1 total=3 label=''" desc="Progression d'un parcours multi-\xE9tapes (\xAB \xC9tape 2 sur 3 \xBB)">
  <col gap=8 w=fill>
    <row gap=auto><text size=14 weight=600>{label || '\xC9tape ' + step + ' sur ' + total}</text><text size=14 color=$muted tabular>{round(step / total * 100)} %</text></row>
    <row gap=4 w=fill><frame repeat={total} h=4 w=fill radius=full fill={i < step ? $primary : $surface-2} transition=300/></row>
  </col>
</component>

<component name="Breadcrumbs" props="items={['Accueil','Cat\xE9gorie','Article']}" desc="Fil d'Ariane (position dans la hi\xE9rarchie)">
  <row gap=8 wrap size=14>
    <row each={items} gap=8><text color={last ? $text : $muted} weight={last ? 600 : 400} underline={!last}>{item}</text><icon if={!last} name=chevron-right size=14 color=$muted/></row>
  </row>
</component>

<component name="Tooltip" props="text='Info-bulle' side=top" desc="Info-bulle avec fl\xE8che. side: top|bottom (la fl\xE8che pointe vers l'\xE9l\xE9ment)">
  <col align=center>
    <frame if={side == 'bottom'} w=10 h=10 rotate=45 fill=#1C1C22 mb=-6/>
    <text px=12 py=8 radius=8 bg=#1C1C22 color=#FFFFFF size=12 lh=1.4 maxw=240 shadow=md>{text}</text>
    <frame if={side != 'bottom'} w=10 h=10 rotate=45 fill=#1C1C22 mt=-6/>
  </col>
</component>

<component name="Alert" props="tone=info title='Information' text='' close=true" desc="Banni\xE8re de statut. tone: info|success|warning|error (ic\xF4ne + titre + texte + fermeture)">
  <row w=fill gap=12 p=16 radius=14 align=start fill={alpha(tone == 'success' ? $success : tone == 'warning' ? $warning : tone == 'error' ? $danger : $info, 10)} stroke={'1 ' + alpha(tone == 'success' ? $success : tone == 'warning' ? $warning : tone == 'error' ? $danger : $info, 30)}>
    <stack w=28 h=28 radius=full center fill={tone == 'success' ? $success : tone == 'warning' ? $warning : tone == 'error' ? $danger : $info} color=#FFFFFF><icon name={tone == 'success' ? 'check' : tone == 'warning' ? 'triangle-alert' : tone == 'error' ? 'x' : 'info'} size=16 stroke=2.5/></stack>
    <col gap=4 w=fill><text weight=600>{title}</text><text if={text} size=14 color=$muted lh=1.5>{text}</text></col>
    <icon if={close} name=x size=18 color=$muted/>
  </row>
</component>

<component name="Snackbar" props="message='Message supprim\xE9' action='Annuler'" desc="Confirmation \xE9ph\xE9m\xE8re avec action d'annulation">
  <row gap=16 px=16 h=48 radius=12 fill=#1C1C22 color=#F4F4F6 shadow=lg w=fill maxw=480>
    <text w=fill size=14 truncate>{message}</text>
    <text if={action} size=14 weight=700 color=#B4A8FF cursor=pointer>{action}</text>
  </row>
</component>

<component name="Menu" props="w=240" desc="Menu d\xE9roulant / contextuel : contient des MenuItem (et des divider)">
  <col w={w} p=6 radius=12 fill=$bg stroke={'1 ' + $border} shadow=layered gap=2>
    <slot/>
  </col>
</component>

<component name="MenuItem" props="label='Action' icon='' shortcut='' danger=false disabled=false selected=false submenu=false" desc="Ligne de menu : ic\xF4ne, raccourci align\xE9 \xE0 droite, sous-menu \u25B8, \xE9tat s\xE9lectionn\xE9">
  <row h=40 px=10 gap=10 radius=8 hover:fill=$surface opacity={disabled ? 0.4 : 1} events={disabled ? 'none' : 'auto'} color={danger ? $danger : $text} fill={selected ? $primary-soft : 'transparent'} cursor=pointer>
    <icon if={icon} name={icon} size=16/>
    <text w=fill size=14 weight={selected ? 600 : 400} truncate>{label}</text>
    <text if={shortcut} size=12 color=$muted mono>{shortcut}</text>
    <icon if={selected} name=check size=16 color=$primary/>
    <icon if={submenu} name=chevron-right size=16 color=$muted/>
  </row>
</component>

<component name="Select" props="label='' value='' placeholder='Choisir\u2026' open=false" desc="Liste d\xE9roulante (au-del\xE0 de 5 choix). Les options vont dans le slot (Menu/MenuItem) quand open">
  <col gap=8 w=fill>
    <text if={label} size=14 weight=600 color=$muted>{label}</text>
    <row h=48 px=16 gap=8 radius=12 fill=$bg stroke={open ? '2 ' + $primary : '1 ' + $border} hover:stroke={'1 ' + $muted} cursor=pointer>
      <text w=fill color={value ? $text : $muted} truncate>{value || placeholder}</text>
      <icon name={open ? 'chevron-up' : 'chevron-down'} size=18 color=$muted/>
    </row>
    <slot if={open}/>
  </col>
</component>

<component name="AvatarGroup" props="names={['L\xE9a Martin','Hugo B','In\xE8s K','Malik D','Zo\xE9 R']} size=32 max=4" desc="Pile d'avatars qui se chevauchent">
  <row>
    <image each={slice(names, 0, max)} as=nm src={'avatar:' + nm} w={size} h={size} radius=full ml={i == 0 ? 0 : -round(size * 0.3)} stroke={'2 ' + $bg + ' outside'}/>
    <stack if={len(names) > max} w={size} h={size} radius=full fill=$surface-2 center ml={-round(size * 0.3)} stroke={'2 ' + $bg + ' outside'}><text size=12 weight=600>+{len(names) - max}</text></stack>
  </row>
</component>

<component name="SocialProof" props="rating=4.9 count='12 000' label='utilisateurs'" desc="Preuve sociale : avatars + note + nombre d'avis">
  <row gap=12>
    <AvatarGroup size=32/>
    <col gap=2>
      <Rating value={round(rating)} size=14/>
      <text size=14 color=$muted>Not\xE9 <b>{rating}/5</b> par {count} {label}</text>
    </col>
  </row>
</component>

<component name="EmptyState" props="icon=inbox title='Rien ici pour l\u2019instant' text='' action=''" desc="\xC9tat vide utile : explique et propose l'action suivante">
  <col align=center gap=12 p=32 w=fill>
    <stack w=64 h=64 radius=20 fill=$primary-soft color=$primary center><icon name={icon} size=28/></stack>
    <text size=18 weight=600 align=center>{title}</text>
    <text if={text} color=$muted align=center maxw=320 size=14 lh=1.5>{text}</text>
    <Button if={action} label={action} kind=secondary size=sm/>
  </col>
</component>

<component name="Pagination" props="count=5 active=1" desc="Pagination num\xE9rot\xE9e (cibles 40px)">
  <row gap=4>
    <IconButton icon=chevron-left size=40/>
    <stack each={range(1, count + 1)} as=pg w=40 h=40 radius=10 center fill={pg == active ? $text : 'transparent'} color={pg == active ? $bg : $text} hover:fill={pg == active ? $text : $surface} cursor=pointer><text size=14 weight=600 tabular>{pg}</text></stack>
    <IconButton icon=chevron-right size=40/>
  </row>
</component>

<component name="FAB" props="icon=plus label=''" desc="Bouton d'action flottant (action principale, zone du pouce)">
  <row gap=8 h=56 px={label ? 20 : 0} w={label ? 'hug' : 56} justify=center radius=18 fill=$primary color=$on-primary shadow={'tinted(' + $primary + ', 35)'} press:scale=0.95 cursor=pointer>
    <icon name={icon} size=24/><text if={label} weight=600>{label}</text>
  </row>
</component>

<component name="ConfirmDialog" props="title='Supprimer le projet ?' message='Cette action est d\xE9finitive.' confirm='Supprimer' cancel='Annuler' danger=true" desc="Confirmation d'action irr\xE9versible : verbes d'action (jamais Oui/Non), bouton rouge">
  <col w=320 fill=$bg radius=24 p=24 gap=16 shadow=e5>
    <stack w=48 h=48 radius=full fill={danger ? alpha($danger, 12) : $primary-soft} color={danger ? $danger : $primary} center><icon name={danger ? 'trash-2' : 'info'} size=22/></stack>
    <col gap=8><text size=20 weight=700>{title}</text><text color=$muted lh=1.5>{message}</text></col>
    <row gap=12><Button label={cancel} kind=secondary full on:click="close"/><Button label={confirm} kind={danger ? 'danger' : 'primary'} full on:click="close"/></row>
  </col>
</component>

<component name="Testimonial" props="quote='Un outil qui a chang\xE9 notre fa\xE7on de travailler.' name='L\xE9a Martin' role='Product designer' rating=5" desc="Carte d'avis client">
  <col gap=16 p=24 radius=20 fill=$surface stroke={'1 ' + $border} w=fill>
    <Rating value={rating} size=16/>
    <text size=16 lh=1.6>\xAB {quote} \xBB</text>
    <row gap=12><Avatar name={name} size=40/><col><text weight=600 size=14>{name}</text><text size=12 color=$muted>{role}</text></col></row>
  </col>
</component>

<component name="OrDivider" props="label='ou'" desc="S\xE9parateur avec libell\xE9 (\xAB ou \xBB)">
  <row gap=12 w=fill><divider w=fill/><text size=14 color=$muted>{label}</text><divider w=fill/></row>
</component>
